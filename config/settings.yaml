api:
  # Estos campos pueden sobrescribirse desde .env (CMC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
  cmc_key: "PUT_YOUR_CMC_API_KEY"
  telegram_token: "PUT_YOUR_TELEGRAM_BOT_TOKEN"
  telegram_chat_id: "PUT_YOUR_TELEGRAM_CHAT_ID"

run:
  send_telegram: false
  cvd_hours: 24
  ob_levels: 20

  # Control de tasa / robustez HTTP
  request_delay_seconds_phase1: 0.50  # delay entre klines (Fase 1)
  request_delay_seconds: 0.50         # delay entre orderflow (Fase 2)
  http_timeout_seconds: 30
  http_max_retries: 5
  http_backoff_base: 0.5

  # Para estabilizar durante pruebas (opcional). Quita cuando esté estable.
  # limit_symbols: 80

  # Presupuesto por defecto si no pasas --budget (opcional)
  # default_budget: 5000

lanes:
  btc:
    weight: 0.25
    trailing: 0.038
    buy_threshold: 60
  eth:
    weight: 0.15
    trailing: 0.050
    buy_threshold: 60
  top20:
    weight: 0.60
    trailing_default: 0.07
    max_candidates: 20
    buy_threshold: 60

quality:
  # Liquidez mínima y techo de volatilidad
  min_avg_vol_usd: 6000000
  max_atr_pct: 22

signals:
  # Señales de acumulación
  vol_vs_avg_min: 1.08
  taker_buy_dom_min: 0.53
  ob_imb_bid_min: 0.53
  near_sma_mult: 1.08
  confirm_days: 1

entry_trailing:
  # Trailing para COMPRAS (rebote desde mínimo reciente)
  lookback_days_for_min: 10
  trigger_from_min_pct: 0.03

exit_trailing:
  # Trailing para VENTAS PARCIALES
  btc: 0.038
  eth: 0.050
  top20_default: 0.07
  partial_take_pct: 0.30

report:
  locale: "en"
  show_transfers: true
